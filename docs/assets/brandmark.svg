<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">

  <!-- Tile. The slate ring keeps the silhouette when the page is as dark as
       the tile (GitHub dark is #0d1117 against this #111820). -->
  <rect width="512" height="512" rx="114" fill="#111820"/>
  <rect x="5" y="5" width="502" height="502" rx="109" fill="none" stroke="#33424D" stroke-width="10"/>

  <!-- Two full lines of transcript: the story's text. -->
  <g fill="#F2E9D8">
    <rect x="130" y="128" width="252" height="28" rx="14"/>
    <rect x="130" y="356" width="252" height="28" rx="14"/>
  </g>

  <!-- The interpreter stepping down through them. The steps overlap, so the
       staircase reads as one diagonal stroke and the whole mark reads as Z. -->
  <g fill="#C95248">
    <rect x="286" y="162" width="96" height="28" rx="14"/>
    <rect x="255" y="194" width="96" height="28" rx="14"/>
    <rect x="224" y="226" width="96" height="28" rx="14"/>
    <rect x="192" y="258" width="96" height="28" rx="14"/>
    <rect x="161" y="290" width="96" height="28" rx="14"/>
    <rect x="130" y="322" width="96" height="28" rx="14"/>
  </g>

</svg>
