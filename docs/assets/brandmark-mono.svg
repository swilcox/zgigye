<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">

  <!-- The brandmark's stepped Z resolved into one solid stroke. Same bounding
       box (130,128)-(382,384), so the two marks sit at the same optical size.
       The steps close up below ~32px; this stays crisp at 16. -->
  <rect width="512" height="512" rx="114" fill="#000000"/>
  <path d="M130 128 H382 V184 L214 328 H382 V384 H130 V328 L298 184 H130 Z" fill="#FFFFFF"/>

</svg>
